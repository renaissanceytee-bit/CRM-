services:
  - type: web
    name: procrm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: procrm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: APP_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPPORT_EMAIL
        value: support@yourdomain.com
      - key: SMTP_FROM
        value: Service Mafia <no-reply@yourdomain.com>
      - key: STRIPE_SECRET_KEY
        sync: false
